[Interface]
# Базовые параметры WireGuard
PrivateKey = <client private key, base64>
Address = 10.0.0.2/32
DNS = 1.1.1.1, 1.0.0.1
MTU = 1408

# AmneziaWG обфускация — удалите блок, если используете обычный WireGuard
Jc = 4
Jmin = 40
Jmax = 70
S1 = 50
S2 = 100
S3 = 0
S4 = 0
H1 = 1
H2 = 2
H3 = 3
H4 = 4
I1 = <hex string>
I2 = <hex string>
I3 = <hex string>
I4 = <hex string>
I5 = <hex string>

# Только AmneziaWG 1.5 — в 2.0 и 3.0 этих параметров нет, для 3.0 они
# отбрасываются парсером (ядро отвергает неизвестные ключи целиком).
J1 = 0
J2 = 0
J3 = 0
ITime = 0

# AmneziaWG 3.0 — достаточно одного любого параметра ниже, чтобы парсер
# выставил version: 3 и mihomo поднял v3-реализацию ядра.
# Значения задаются диапазоном "a-b" или одним числом.
#
# HeaderProtectionKey — ключ шифрования заголовков (awg genkey, base64).
#   Должен совпадать с сервером. ВАЖНО: требует S1-S4 >= 12, иначе peer
#   не запустится вообще.
# ContentPaddingAddition — добавочный случайный размер payload'а,
#   желательно одинаковый на обеих сторонах.
# Остальное — тайминги хендшейка, чисто клиентские, в секундах.
# HeaderProtectionKey = <base64 key>
# ContentPaddingAddition = 0-64
# RekeyAfterTime = 100-140
# RekeyTimeout = 4-6
# RejectAfterTime = 160-200
# KeepaliveTimeout = 8-12
# MaxHandshakeAttempts = 16-20

[Peer]
PublicKey = <server public key, base64>
PresharedKey = <preshared key, base64>
Endpoint = server.example.com:51820
AllowedIPs = 0.0.0.0/0, ::/0
# В 3.0 допустим диапазон (22-30), но mihomo принимает только одно число —
# парсер возьмёт нижнюю границу.
PersistentKeepalive = 25

# Параметры, специфичные для адаптера mihomo (читаются парсером по имени,
# секция произвольная — entrypoint игнорирует [Interface]/[Peer]/[Mihomo]).
[Mihomo]
# Имя другого proxy в конфиге, через который пойдёт исходящее соединение.
DialerProxy =
# Резолвить DNS удалённой стороной (true) или локально (false).
RemoteDnsResolve = false
# Кол-во worker-потоков (по умолчанию авто).
Workers =
# Reserved bytes для WireGuard (3 байта через запятую, например 0,0,0).
Reserved =
# Принудительная версия AmneziaWG: 3 — включить v3-реализацию, даже если ни
# одного 3.0-параметра в конфиге нет. Пусто = определяется автоматически.
AwgVersion =
